apiVersion: apps/v1
kind: Deployment
metadata:
  name: fte-worker
  namespace: fte-factory
  labels:
    app: fte-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fte-worker
  template:
    metadata:
      labels:
        app: fte-worker
    spec:
      containers:
        - name: fte-worker
          image: fte-factory/api:latest
          command: ["python", "-m", "src.workers.message_processor"]
          envFrom:
            - configMapRef:
                name: fte-config
            - secretRef:
                name: fte-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
